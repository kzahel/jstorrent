[workspace]
members = [
    "clients/desktop/src-tauri",
    "crates/rstorrent-android",
    "crates/rstorrent-crostini",
    "crates/rstorrent-direct-file",
    "crates/rstorrent-engine",
    "crates/rstorrent-gateway",
    "crates/rstorrent-headless",
    "crates/rstorrent-ios",
    "crates/rstorrent-media",
    "crates/rstorrent-media-catalog",
    "crates/rstorrent-native-host",
    "crates/rstorrent-platform",
    "crates/rstorrent-protocol",
    "crates/rstorrent-remote-access",
    "crates/rstorrent-remote-crypto",
    "crates/rstorrent-remote-host",
    "crates/rstorrent-remote-relay",
    "crates/rstorrent-remote-wasm",
    "crates/rstorrent-session",
]
exclude = ["vendor/glib-0.18.5"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "net", "process"] }
dontfrag = { version = "1.0.1", features = ["tokio"] }
axum = "0.8.4"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
async-compression = { version = "0.4", default-features = false, features = ["gzip", "tokio"] }
base64 = "0.22.1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
crypto-bigint = { version = "=0.7.6", default-features = false }
futures-util = "0.3.31"
flate2 = "1.1.9"
getrandom = "0.3.4"
hkdf = "0.12.4"
minisign-verify = "0.2.5"
quick-xml = "0.41.0"
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdh", "ecdsa"] }
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
regex = "1.13.1"
rustls = { version = "0.23.46", default-features = false }
rustls-platform-verifier = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.6"
sha2 = "0.10.9"
subtle = "2.6.1"
schemars = "1.2.2"
tokio = "1.47.1"
tokio-util = "0.7.16"
tokio-tungstenite = "0.29.0"
toml = { version = "=1.1.4", default-features = false, features = ["std", "serde", "parse"] }
tar = "0.4.46"
tempfile = "3.27.0"
tower-http = "0.6.11"
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }
wasm-bindgen = "=0.2.127"
zeroize = "1.9.0"

# Keep ordinary engine and desktop runs representative enough for networking,
# hashing, storage, and UI work. Preserve the dev profile's debug assertions
# and overflow checks plus file/line backtraces, but avoid the full debug and
# incremental artifacts that rapidly exhaust disk space on macOS.
[profile.dev]
opt-level = 2
debug = "line-tables-only"
incremental = false

# Use this profile for deliberate source-level debugger sessions that need
# local variables and unoptimized control flow. It has a separate output
# directory so its full debug artifacts can be cleaned independently.
[profile.debugging]
inherits = "dev"
opt-level = 0
debug = "full"

# Approved RUSTSEC-2024-0429 backport; provenance and retirement in Tactical 218.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
