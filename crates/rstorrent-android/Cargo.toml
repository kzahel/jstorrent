[package]
name = "rstorrent-android"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "rstorrent-uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen"]

[dependencies]
libc = "=0.2.189"
# The fixed descriptor surface is retained only for the separate EngineService
# diagnostic harness. AndroidApplicationClient product storage is dynamic.
rstorrent-engine = { path = "../rstorrent-engine", features = ["descriptor-storage-diagnostics"] }
rstorrent-gateway = { path = "../rstorrent-gateway" }
rstorrent-media = { path = "../rstorrent-media" }
rstorrent-protocol = { path = "../rstorrent-protocol" }
rstorrent-session = { path = "../rstorrent-session", features = ["uniffi"] }
serde_json.workspace = true
sha1.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
uniffi = { version = "=0.31.0", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", default-features = false }
rustls-platform-verifier = "=0.7.0"
