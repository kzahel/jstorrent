[package]
name = "rstorrent-direct-file"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
webrtc = ["dep:bytes", "dep:rtc", "dep:serde", "dep:sha2"]
experiment = [
    "webrtc",
    "dep:axum",
    "dep:serde_json",
    "dep:sha1",
    "dep:sha2",
    "dep:tempfile",
    "dep:log",
]

[dependencies]
log = { version = "0.4.33", optional = true }
axum = { workspace = true, optional = true }
bytes = { version = "1.12.1", optional = true }
rtc = { version = "=0.20.4", default-features = false, features = ["ring"], optional = true }
rstorrent-session = { path = "../rstorrent-session" }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true

[[bin]]
name = "rstorrent-direct-file-experiment"
path = "src/bin/experiment.rs"
required-features = ["experiment"]
