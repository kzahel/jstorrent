[package]
name = "rstorrent-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
uniffi = ["dep:uniffi"]

[dependencies]
base64 = { workspace = true }
rstorrent-engine = { path = "../rstorrent-engine" }
rstorrent-media-catalog = { path = "../rstorrent-media-catalog" }
rstorrent-protocol = { path = "../rstorrent-protocol" }
getrandom = { workspace = true }
rusqlite = { workspace = true, features = ["backup"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
ts-rs = { workspace = true }
uniffi = { version = "=0.31.0", default-features = false, optional = true }
url = { workspace = true }
uuid = { workspace = true }
# Torrent list bundles (Tactical 348); the version the desktop updater locks.
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
tempfile = { workspace = true }

[dev-dependencies]
rstorrent-engine = { path = "../rstorrent-engine", features = ["test-platform-root"] }
tokio-rustls = "0.26.4"
