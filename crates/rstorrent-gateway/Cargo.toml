[package]
name = "rstorrent-gateway"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
futures-util = { workspace = true, features = ["sink"] }
getrandom.workspace = true
hyper = { version = "1.11.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio", "service"] }
rstorrent-session = { path = "../rstorrent-session" }
rstorrent-media = { path = "../rstorrent-media" }
rstorrent-platform = { path = "../rstorrent-platform" }
rusqlite.workspace = true
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
tower-http = { workspace = true, features = ["cors", "fs"] }
ts-rs = { workspace = true }

[dev-dependencies]
sha1 = { workspace = true }
tokio-tungstenite.workspace = true
