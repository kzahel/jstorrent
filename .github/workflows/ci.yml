name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verification-matrix:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/verification-matrix.yml

  dependency-review:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/dependency-review.yml

  rust:
    name: Rust and loopback interop
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613 # 1.97.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-rust-ubuntu-24.04

      - name: Install Linux desktop build dependencies
        run: |
          bash scripts/configure-ci-apt.sh
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            openssl \
            patchelf

      - name: Install uv and locked Python 3.12 environment
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: tests/interop/uv.lock

      - name: Provide the Tauri compile-time asset directory
        run: mkdir -p clients/web/dist

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint the Rust workspace
        run: cargo clippy --workspace -- -D warnings

      - name: Lint and test the default direct-file WebRTC graph
        run: |
          cargo clippy \
            -p rstorrent-direct-file \
            -p rstorrent-headless \
            -p rstorrent-desktop \
            --features \
              rstorrent-direct-file/experiment,rstorrent-headless/direct-file-webrtc,rstorrent-desktop/direct-file-webrtc \
            -- -D warnings
          cargo test --locked -p rstorrent-direct-file --features webrtc --timings
          cargo test --locked -p rstorrent-remote-host --features direct-file-webrtc --timings

      - name: Keep the direct-file graph out of explicit feature-off products
        run: |
          cargo clippy -p rstorrent-headless --no-default-features -- -D warnings
          cargo clippy -p rstorrent-desktop --no-default-features -- -D warnings
          test -z "$(cargo tree -p rstorrent-headless --no-default-features | grep 'rtc v' || true)"
          test -z "$(cargo tree -p rstorrent-desktop --no-default-features | grep 'rtc v' || true)"

      - name: Compile Rust workspace tests with build timings
        run: cargo test --locked --workspace --no-run --timings

      - name: Test the Rust workspace
        run: cargo test --locked --workspace

      - name: Install the locked interoperability environment
        run: uv sync --project tests/interop --locked --python 3.12

      - name: Run one deterministic libtorrent transfer
        run: >-
          uv run --project tests/interop --locked
          python tests/interop/first_verified_piece.py --runs 1

      - name: Build application lifecycle diagnostic
        run: cargo build --locked -p rstorrent-gateway

      - name: Verify complete application lifecycle and corruption repair
        timeout-minutes: 10
        run: >-
          uv run --project tests/interop --locked
          python tests/interop/application_lifecycle_smoke.py
          --binary target/debug/rstorrent-gateway
          --output artifacts/verification/application-lifecycle.json

      - name: Retain bounded application verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verification/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain Rust compilation timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-build-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  release-tools:
    name: Workflow and release tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Lint workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9

      - name: Verify PR review gates and proxy boundaries
        run: node --test .github/agent-review/review.test.mjs .github/scripts/fast-ci.test.mjs

      - name: Verify backport integrity and failure cases
        run: |
          python3 scripts/glib_backport.py
          python3 -m unittest discover -s scripts -p test_glib_backport.py

      - name: Validate desktop release configuration and tools
        run: |
          node scripts/validate-desktop-release.mjs
          bash scripts/configure-ci-apt.sh
          sudo apt-get update
          sudo apt-get install -y minisign
          node scripts/validate-jstorrent-candidate.mjs
          node --test \
            scripts/assemble-pages-site.test.mjs \
            scripts/validate-jstorrent-candidate.test.mjs \
            scripts/verify-desktop-signatures.test.mjs \
            scripts/validate-desktop-package.test.mjs \
            scripts/validate-desktop-release.test.mjs \
            .github/scripts/desktop-release-artifacts.test.mjs \
            .github/scripts/validate-desktop-release.test.mjs \
            .github/scripts/write-release-checksums.test.mjs \
            scripts/nightly-desktop-release.test.mjs \
            scripts/latest-desktop-release.test.mjs \
            scripts/desktop-release-input.test.mjs \
            scripts/desktop-release-train.test.mjs \
            scripts/desktop-release-metadata.test.mjs \
            scripts/desktop-promotion.test.mjs \
            scripts/prepare-private-update-qualification.test.mjs \
            scripts/apply-desktop-nightly-version.test.mjs \
            scripts/check-release-compatibility.test.mjs \
            scripts/compat-ledger.test.mjs \
            scripts/compat-window.test.mjs \
            scripts/extension-store-version.test.mjs

      # Every supported delivery must be captured for the compatibility
      # matrix (docs/tactical/359 and 370).
      - name: Check compatibility delivery ledger
        run: |
          git fetch --force --tags --depth=1 origin
          node scripts/compat-ledger.mjs

      - name: Verify dependency and distribution review tools
        run: |
          bash scripts/configure-ci-apt.sh
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          python3 -m unittest discover -s scripts -p test_distribution_review.py
          python3 -m unittest discover -s scripts -p test_package_appimage_sources.py
          python3 -m unittest discover -s scripts -p test_current_appimage_sources.py
          python3 -m unittest discover -s tests/interop/desktop_updates -p 'test_live_*.py'

      - name: Validate Crostini bootstrap release tools
        run: |
          bash scripts/test-crostini-installer.sh
          node --test .github/scripts/write-crostini-release-manifest.test.mjs

      - name: Validate headless bootstrap release tools
        run: |
          bash scripts/test-headless-installer.sh
          node --test .github/scripts/write-headless-release-manifest.test.mjs

  extension:
    name: Extension tests and companion package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install locked companion build dependencies
        run: npm ci --prefix clients/web

      - name: Validate and package the JSTorrent Beta extension seed
        run: |
          npm test --prefix clients/extension
          npm run package --prefix clients/extension

  web:
    name: Web type, unit, build, and deterministic E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613 # 1.97.0

      - name: Cache generated-contract Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-web-contract-ubuntu-24.04

      - name: Install locked web dependencies
        run: npm ci --prefix clients/web

      - name: Regenerate and verify the application contract
        run: |
          npm run generate --prefix clients/web
          git diff --exit-code -- \
            clients/web/src/api/generated \
            clients/web/src/fixtures/reactive-trace.json \
            clients/web/src/fixtures/view-set-trace.json

      - name: Check product branding and original assets
        run: node scripts/check-branding.mjs

      - name: Typecheck the shared web application
        run: npm run typecheck --prefix clients/web

      - name: Check catalogs and translation workflow
        run: |
          git diff --exit-code -- clients/web/src/localization/generated
          node scripts/check-localization.mjs
          node --test scripts/test-localization-registry.mjs
          python3 -m unittest discover -s scripts -p 'test_*localization*.py'
          python3 -m unittest discover -s clients/android/scripts -p test_localization.py

      - name: Run web unit tests
        run: npm run test --prefix clients/web

      - name: Build the production web application
        run: npm run build --prefix clients/web

      - name: Install pinned Playwright Chromium and system dependencies
        working-directory: clients/web
        run: npx playwright install --with-deps chromium

      - name: Run deterministic browser end-to-end tests
        run: npm run test:e2e --prefix clients/web

      - name: Retain browser failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: clients/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Desktop ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-26
            bundle: app
            artifact-arch: arm64
          - name: Windows x86_64
            runner: windows-2025
            bundle: nsis
            artifact-arch: x86_64
          - name: Linux x86_64
            runner: ubuntu-24.04
            bundle: appimage
            artifact-arch: x86_64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            bundle: appimage
            artifact-arch: arm64
    runs-on: ${{ matrix.runner }}
    # A cold Windows cache takes about an hour. rust-cache saves only after a
    # successful job, so a tighter limit can keep the cache from recovering.
    timeout-minutes: 90
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613 # 1.97.0

      - name: Cache desktop Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-desktop-${{ matrix.runner }}

      - name: Install Linux desktop packaging dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/configure-ci-apt.sh
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            libarchive-tools \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            openssl \
            patchelf \
            xdg-utils

      - name: Install locked web dependencies
        run: npm ci --prefix clients/web

      - name: Verify localization generation before native compilation
        run: npm run generate:localization --prefix clients/web

      - name: Test localization compiler launch and generated catalogs
        run: npm run test --prefix clients/web -- scripts/generate-localization.test.mjs

      - name: Check generated localization catalogs are current
        run: git diff --exit-code -- clients/web/src/localization/generated

      - name: Provide the Tauri compile-time asset directory
        shell: bash
        run: mkdir -p clients/web/dist

      - name: Verify the approved GLib source override
        run: python3 scripts/glib_backport.py

      - name: Run desktop native tests
        run: cargo test -p rstorrent-desktop

      - name: Exercise the GLib backport with release optimization
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p rstorrent-desktop --test glib_backport

      - name: Verify native session lifecycle and catalog recovery
        run: cargo test --locked -p rstorrent-session --lib

      - name: Exercise native Windows local-address selection
        if: runner.os == 'Windows'
        run: >-
          cargo test -p rstorrent-engine
          windows_native_local_network_selection_returns_an_eligible_route
          --lib

      - name: Install pinned license notice generator
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      - name: Build reviewed Linux native libraries without GPL-only chains
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            cmake dpkg-dev patch libdbusmenu-gtk3-dev libgirepository1.0-dev \
            libjpeg-dev liblzma-dev libzstd-dev libwebp-dev zlib1g-dev \
            libdeflate-dev liblerc-dev
          python3 scripts/build-linux-native.py \
            --sources-dir "$RUNNER_TEMP/jstorrent-native-sources" \
            --output "$RUNNER_TEMP/jstorrent-native-build" --download
          echo "JSTORRENT_LINUX_NATIVE_BUILD=$RUNNER_TEMP/jstorrent-native-build" >> "$GITHUB_ENV"

      - name: Build one unsigned native package
        working-directory: clients/desktop
        shell: bash
        run: >-
          ../web/node_modules/.bin/tauri build
          --config src-tauri/tauri.package.conf.json
          --bundles "${{ matrix.bundle }}" --no-sign --ci

      - name: Verify the native package exists
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)
              APP_PATH=$(find target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)
              test -n "$APP_PATH"
              node scripts/smoke-native-host.mjs "$APP_PATH/Contents/MacOS/rstorrent-native-host"
              ;;
            Windows)
              test "$(find target/release/bundle/nsis -maxdepth 1 -type f -name '*-setup.exe' | wc -l)" -eq 1
              ;;
            Linux)
              APPIMAGE=$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
              test -n "$APPIMAGE"
              "$APPIMAGE" --appimage-extract >/dev/null
              test -x squashfs-root/usr/bin/rstorrent-native-host
              node scripts/smoke-native-host.mjs squashfs-root/usr/bin/rstorrent-native-host
              python3 scripts/inspect-distribution.py --root squashfs-root --require-native-notices --require-mit-native --output artifacts/distribution/linux.json
              rm -rf squashfs-root
              ;;
          esac

      - name: Verify macOS activation metadata
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH=$(find target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          node scripts/validate-desktop-package.mjs --mac-app "$APP_PATH"
          python3 scripts/inspect-distribution.py --root "$APP_PATH" --output artifacts/distribution/macos.json

      - name: Verify installed Windows activation registry
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem 'target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installer.Count -ne 1) {
            throw "Expected one NSIS installer; found $($installer.Count)"
          }
          $installDirectory = Join-Path $env:LOCALAPPDATA 'JSTorrent Preview'
          $executable = Join-Path $installDirectory 'jstorrent-client.exe'
          $nativeHost = Join-Path $installDirectory 'rstorrent-native-host.exe'
          try {
            $install = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S' -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "Silent NSIS install failed with exit code $($install.ExitCode)"
            }
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "Installed RSTorrent executable is missing"
            }
            if (-not (Test-Path -LiteralPath $nativeHost -PathType Leaf)) {
              throw "Installed RSTorrent native host is missing"
            }
            node scripts/smoke-native-host.mjs $nativeHost
            if ($LASTEXITCODE -ne 0) {
              throw "Installed Windows native host smoke failed"
            }
            $torrentExtension = Get-Item 'Registry::HKEY_CURRENT_USER\Software\Classes\.torrent'
            $torrentCommand = Get-Item 'Registry::HKEY_CURRENT_USER\Software\Classes\com.jstorrent.rstorrent.torrent\shell\open\command'
            $magnet = Get-Item 'Registry::HKEY_CURRENT_USER\Software\Classes\magnet'
            $magnetCommand = Get-Item 'Registry::HKEY_CURRENT_USER\Software\Classes\magnet\shell\open\command'
            @{
              executable = $executable
              torrentProgId = $torrentExtension.GetValue('')
              torrentCommand = $torrentCommand.GetValue('')
              magnetUrlProtocol = $magnet.GetValue('URL Protocol')
              magnetCommand = $magnetCommand.GetValue('')
            } | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP\rstorrent-registry.json"
            python scripts/inspect-distribution.py --root $installDirectory --output artifacts/distribution/windows.json
            if ($LASTEXITCODE -ne 0) {
              throw "Installed Windows distribution inspection failed"
            }
            node scripts/validate-desktop-package.mjs --windows-registry-json "$env:RUNNER_TEMP\rstorrent-registry.json"
            if ($LASTEXITCODE -ne 0) {
              throw "Installed Windows activation registry validation failed"
            }
          } finally {
            $uninstaller = Join-Path $installDirectory 'uninstall.exe'
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait | Out-Null
            }
          }

      - name: Verify Linux activation metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APPIMAGE=$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$APPIMAGE"
          EXTRACT_DIR="$RUNNER_TEMP/rstorrent-appimage"
          mkdir -p "$EXTRACT_DIR"
          APPIMAGE=$(realpath "$APPIMAGE")
          (cd "$EXTRACT_DIR" && "$APPIMAGE" --appimage-extract >/dev/null)
          DESKTOP_FILE=$(find "$EXTRACT_DIR/squashfs-root" -type f -name '*.desktop' -print -quit)
          test -n "$DESKTOP_FILE"
          desktop-file-validate "$DESKTOP_FILE"
          node scripts/validate-desktop-package.mjs --linux-desktop "$DESKTOP_FILE"

      - name: Retain distribution inventories
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-${{ runner.os }}-${{ matrix.artifact-arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/distribution/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain Windows package for installed smoke
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 3

      - name: Retain Linux package for installed smoke
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-${{ matrix.artifact-arch }}-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android dual ABI, lint, tests, and owned runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust 1.97.0 and Android targets
        uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613 # 1.97.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Android Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-android-ubuntu-24.04

      - name: Configure Gradle caches
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0

      - name: Install pinned Android SDK and NDK packages
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          'platforms;android-36'
          'build-tools;35.0.0'
          'ndk;28.2.13676358'
          'emulator'
          'system-images;android-35;google_apis;x86_64'

      - name: Install locked Python interoperability environment
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: tests/interop/uv.lock

      - name: Prepare owned emulator runtime
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          uv sync --project tests/interop --locked --python 3.12

      - name: Install cargo-ndk 4.1.2
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install pinned Android notice generator
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      - name: Test Android release tooling
        run: |
          python3 -m unittest discover -s scripts -p 'test_*android*.py'
          scripts/release-android.sh --check

      - name: Cross-build both ABIs and run JVM tests
        run: clients/android/build.sh

      - name: Run Android lint and compile instrumentation tests
        working-directory: clients/android
        run: ./gradlew lintDebug assembleDebugAndroidTest

      - name: Verify Android application and test APKs exist
        run: |
          test -f clients/android/app/build/outputs/apk/debug/app-debug.apk
          test -f clients/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Verify packaged Android attribution
        run: >-
          python3 scripts/inspect-android-notices.py
          --archive clients/android/app/build/outputs/apk/debug/app-debug.apk
          --variant debug --output artifacts/verification/android-notices.json
          --export-notices artifacts/verification/android-notices

      - name: Retain Android attribution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-notices-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verification/android-notices.json
            artifacts/verification/android-notices/
          if-no-files-found: error
          retention-days: 7

      - name: Run owned API 35 product SAF lifecycle
        timeout-minutes: 12
        run: >-
          uv run --project tests/interop --locked
          python scripts/android-runtime-smoke.py
          --output artifacts/verification/android-runtime.json

      - name: Retain bounded Android runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verification/android-runtime.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain Android failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            clients/android/app/build/reports
            clients/android/app/build/test-results
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS simulator tests and unsigned archive
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify Xcode 26.6
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"

      - name: Install Rust 1.97.0 and Apple targets
        uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613 # 1.97.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache iOS Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-ios-macos-26

      - name: Install XcodeGen when the runner does not provide it
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Run iOS simulator unit and UI tests
        run: clients/ios/scripts/test.sh "$RUNNER_TEMP/RSTorrent.xcresult"

      - name: Check the standalone iOS storage probe
        run: >-
          cargo check --locked
          --manifest-path experiments/ios-storage-probe/Cargo.toml
          --target aarch64-apple-ios-sim

      - name: Build an unsigned iOS device archive
        run: clients/ios/scripts/archive.sh --unsigned "$RUNNER_TEMP/RSTorrent.xcarchive"

      - name: Verify the archived application exists
        run: test -d "$RUNNER_TEMP/RSTorrent.xcarchive/Products/Applications/RSTorrent.app"

      - name: Retain iOS failure results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/RSTorrent.xcresult
          if-no-files-found: ignore
          retention-days: 7
