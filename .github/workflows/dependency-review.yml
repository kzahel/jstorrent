name: Dependency advisory review

on:
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - Cargo.toml
      - "**/Cargo.toml"
      - Cargo.lock
      - vendor/**
      - scripts/glib_backport.py
      - scripts/audit-cargo-dependencies.py
      - clients/web/package.json
      - clients/web/package-lock.json
      - website/package.json
      - website/package-lock.json
      - distribution/**
      - scripts/review-dependency-audit.py
      - .github/workflows/dependency-review.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613 # 1.97.0
      - name: Install pinned advisory checker
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Collect current reports
        shell: bash
        run: |
          mkdir -p artifacts/dependencies
          python3 scripts/audit-cargo-dependencies.py --output "$RUNNER_TEMP/cargo-audit.json"
          npm audit --prefix clients/web --json > "$RUNNER_TEMP/npm-audit.json" || test "$?" -eq 1
          npm audit --prefix website --json > "$RUNNER_TEMP/website-npm-audit.json" || test "$?" -eq 1
      - name: Enforce reviewed warnings and report release blockers
        run: >-
          python3 scripts/review-dependency-audit.py
          --cargo "${{ runner.temp }}/cargo-audit.json"
          --npm "${{ runner.temp }}/npm-audit.json"
          --website-npm "${{ runner.temp }}/website-npm-audit.json"
          --output artifacts/dependencies/review.json
      - name: Retain bounded dependency review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dependencies/review.json
          retention-days: 7
          if-no-files-found: ignore
