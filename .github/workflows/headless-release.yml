name: Headless Release

on:
  push:
    tags:
      - "headless-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  source-checks:
    name: Headless release source checks
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            clients/web/package-lock.json
            website/package-lock.json

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613 # 1.97.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: headless-release-source-ubuntu-22.04

      - name: Install locked JavaScript dependencies
        run: |
          npm ci --prefix clients/web
          npm ci --prefix website

      - name: Validate tag, source version, and changelog
        if: startsWith(github.ref, 'refs/tags/headless-v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#headless-v}"
          SOURCE_VERSION=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' crates/rstorrent-headless/Cargo.toml)
          test "$GITHUB_REF_NAME" = "headless-v$SOURCE_VERSION"
          test "$VERSION" = "$SOURCE_VERSION"
          grep -Fqx "## [$VERSION]" crates/rstorrent-headless/CHANGELOG.md

      - name: Validate bootstrap and manifest tools
        run: |
          bash scripts/test-headless-installer.sh
          node --test .github/scripts/write-headless-release-manifest.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint headless packages
        run: cargo clippy -p rstorrent-headless -p rstorrent-gateway -- -D warnings

      - name: Test headless packages
        run: cargo test -p rstorrent-headless -p rstorrent-gateway

      - name: Typecheck and test the shared web application
        run: |
          npm run typecheck --prefix clients/web
          npm run test --prefix clients/web

      - name: Check and build the website
        run: |
          npm run check --prefix website
          npm run build --prefix website

  build-package:
    name: Native ${{ matrix.arch }} headless package
    needs: source-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613 # 1.97.0

      - name: Cache headless builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: headless-release-${{ matrix.runner }}

      - name: Install locked web dependencies
        run: npm ci --prefix clients/web

      - name: Build and validate the native package
        shell: bash
        env:
          RSTORRENT_BUILD_ID: ${{ github.sha }}
        run: |
          ./scripts/build-headless-package.sh
          VERSION=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' crates/rstorrent-headless/Cargo.toml)
          ASSET="target/headless/rstorrent-headless-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          test -f "$ASSET"
          SCRATCH=$(mktemp -d)
          trap 'rm -rf -- "$SCRATCH"' EXIT
          tar -xzf "$ASSET" -C "$SCRATCH"
          test "$("$SCRATCH/bin/rstorrent-headless" --version)" = "rstorrent-headless $VERSION"

      - name: Retain native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rstorrent-headless-${{ matrix.arch }}
          path: target/headless/rstorrent-headless-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Validate and publish tagged headless release
    if: startsWith(github.ref, 'refs/tags/headless-v')
    needs: [source-checks, build-package]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download native packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rstorrent-headless-*
          path: release
          merge-multiple: true

      - name: Install Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install locked signing CLI
        run: npm ci --prefix clients/web

      - name: Generate and sign the canonical release manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          VERSION="${GITHUB_REF_NAME#headless-v}"
          MANIFEST="$GITHUB_WORKSPACE/release/rstorrent-headless-release.manifest"
          SIGNING_INPUT="$RUNNER_TEMP/rstorrent-headless-release.manifest"
          node .github/scripts/write-headless-release-manifest.mjs \
            "$VERSION" "$GITHUB_SHA" \
            "release/rstorrent-headless-${VERSION}-linux-x86_64.tar.gz" \
            "release/rstorrent-headless-${VERSION}-linux-aarch64.tar.gz" \
            "$MANIFEST"
          cp "$MANIFEST" "$SIGNING_INPUT"
          npm exec --prefix clients/web -- tauri signer sign "$SIGNING_INPUT"
          base64 --decode "$SIGNING_INPUT.sig" \
            > release/rstorrent-headless-release.manifest.minisig

      - name: Verify signature, packages, versions, and exact asset set
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#headless-v}"
          MANIFEST="$GITHUB_WORKSPACE/release/rstorrent-headless-release.manifest"
          SIGNATURE="$GITHUB_WORKSPACE/release/rstorrent-headless-release.manifest.minisig"
          SCRATCH=$(mktemp -d)
          trap 'rm -rf -- "$SCRATCH"' EXIT
          export RSTORRENT_HEADLESS_INSTALLER_LIB_ONLY=1
          source website/public/install-headless.sh
          unset RSTORRENT_HEADLESS_INSTALLER_LIB_ONLY
          verify_minisign "$MANIFEST" "$SIGNATURE" "$MINISIGN_PUBLIC_KEY" "$SCRATCH"
          for ARCH in x86_64 aarch64; do
            parse_manifest "$MANIFEST" "$ARCH"
            ASSET="$GITHUB_WORKSPACE/release/$RELEASE_ASSET"
            verify_release_asset "$ASSET" "$RELEASE_SIZE" "$RELEASE_SHA256"
            validate_archive_listing "$ASSET" "$SCRATCH/$ARCH.list"
            mkdir "$SCRATCH/$ARCH"
            tar -xzf "$ASSET" -C "$SCRATCH/$ARCH"
            validate_extracted_bundle_shape "$SCRATCH/$ARCH" "$VERSION" "$ARCH"
          done
          validate_extracted_bundle "$SCRATCH/x86_64" "$VERSION" x86_64
          find release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$SCRATCH/assets.actual"
          cat > "$SCRATCH/assets.expected" <<EOF
          rstorrent-headless-${VERSION}-linux-aarch64.tar.gz
          rstorrent-headless-${VERSION}-linux-x86_64.tar.gz
          rstorrent-headless-release.manifest
          rstorrent-headless-release.manifest.minisig
          EOF
          diff -u "$SCRATCH/assets.expected" "$SCRATCH/assets.actual"
          (
            cd release
            sha256sum \
              "rstorrent-headless-${VERSION}-linux-aarch64.tar.gz" \
              "rstorrent-headless-${VERSION}-linux-x86_64.tar.gz" \
              rstorrent-headless-release.manifest \
              rstorrent-headless-release.manifest.minisig \
              > SHA256SUMS
          )

      - name: Create fail-closed draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#headless-v}"
          awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{found=0} found" \
            crates/rstorrent-headless/CHANGELOG.md > "$RUNNER_TEMP/headless-notes.md"
          {
            cat "$RUNNER_TEMP/headless-notes.md"
            echo
            echo '## Linux installation'
            echo
            echo '```sh'
            echo 'curl -fsSL https://rstorrent.com/install-headless.sh | bash'
            echo '```'
            echo
            echo 'The installer verifies the signed manifest and selected package before changing the per-user installation.'
            echo
            echo '## Automated release evidence'
            echo
            echo "- Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- Native x86_64 and ARM64 package builds and version checks passed.'
            echo "- Exact package/manifest/signature hashes are attached as \`SHA256SUMS\`."
          } > "$RUNNER_TEMP/headless-release-body.md"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --latest=false \
            --title "RSTorrent Headless v$VERSION" \
            --notes-file "$RUNNER_TEMP/headless-release-body.md" \
            "release/rstorrent-headless-${VERSION}-linux-aarch64.tar.gz" \
            "release/rstorrent-headless-${VERSION}-linux-x86_64.tar.gz" \
            release/rstorrent-headless-release.manifest \
            release/rstorrent-headless-release.manifest.minisig \
            release/SHA256SUMS

      - name: Verify and publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#headless-v}"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort > "$RUNNER_TEMP/assets.actual"
          cat > "$RUNNER_TEMP/assets.expected" <<EOF
          SHA256SUMS
          rstorrent-headless-${VERSION}-linux-aarch64.tar.gz
          rstorrent-headless-${VERSION}-linux-x86_64.tar.gz
          rstorrent-headless-release.manifest
          rstorrent-headless-release.manifest.minisig
          EOF
          diff -u "$RUNNER_TEMP/assets.expected" "$RUNNER_TEMP/assets.actual"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
