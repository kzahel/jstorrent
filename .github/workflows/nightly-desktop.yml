name: Nightly Desktop

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild verified source even when packaged inputs are unchanged
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: nightly-desktop
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  select:
    # One-product cutover qualification: no automatic incubation publication.
    if: github.ref == 'refs/heads/main' && vars.INCUBATION_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.select.outputs.build }}
      sha: ${{ steps.select.outputs.sha }}
      version: ${{ steps.select.outputs.version }}
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force || false }}
        run: node scripts/nightly-desktop-release.mjs

  release:
    needs: select
    if: needs.select.outputs.build == 'true'
    uses: ./.github/workflows/desktop-release.yml
    with:
      source_sha: ${{ needs.select.outputs.sha }}
      release_version: ${{ needs.select.outputs.version }}
      release_tag: ${{ needs.select.outputs.tag }}
    secrets: inherit
