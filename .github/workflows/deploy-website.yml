name: Website

on:
  pull_request:
    paths: ["website/**", "scripts/*website*.mjs", "scripts/hosted-context.test.mjs", "scripts/assemble-pages-site*", "scripts/preserve-legacy-remote-assets.mjs", "compat/legacy-remote-assets.json", ".github/workflows/deploy-website.yml"]
  push:
    branches: [main]
    paths: ["website/**", "scripts/*website*.mjs", "scripts/hosted-context.test.mjs", "scripts/assemble-pages-site*", "scripts/preserve-legacy-remote-assets.mjs", "compat/legacy-remote-assets.json", ".github/workflows/deploy-website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: website-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: node --test scripts/assemble-pages-site.test.mjs
      - run: npm ci --prefix website
      - run: npm test --prefix website
      - run: npm run check --prefix website
      - run: npm run build --prefix website
      - run: node scripts/assemble-pages-site.mjs
      - name: Record canonical website source provenance
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('website/src/data/production-release.json', 'utf8')).release;
          if (typeof release?.version !== 'string') throw new Error('Missing qualified desktop version');
          mkdirSync('website/dist/.well-known', {recursive:true});
          writeFileSync('website/dist/.well-known/jstorrent-website.json', JSON.stringify({sourceRepository:process.env.SOURCE_REPOSITORY, sourceSha:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), desktopVersion:release.version})+'\n');
          JS

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=rstorrent-site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
