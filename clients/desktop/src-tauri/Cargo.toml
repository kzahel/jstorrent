[package]
name = "rstorrent-desktop"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "jstorrent-client"

[[bin]]
name = "jstorrent-client"
path = "src/main.rs"

[features]
default = ["direct-file-webrtc"]
direct-file-webrtc = ["rstorrent-remote-host/direct-file-webrtc"]

[lib]
name = "rstorrent_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rstorrent-session = { path = "../../../crates/rstorrent-session" }
rstorrent-media = { path = "../../../crates/rstorrent-media" }
rstorrent-gateway = { path = "../../../crates/rstorrent-gateway" }
rstorrent-native-host = { path = "../../../crates/rstorrent-native-host" }
rstorrent-platform = { path = "../../../crates/rstorrent-platform" }
rstorrent-remote-host = { path = "../../../crates/rstorrent-remote-host" }
getrandom.workspace = true
reqwest = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "=2.5.3"
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-single-instance = { version = "=2.4.3", features = ["deep-link"] }
tauri-plugin-updater = { version = "=2.10.1", default-features = false, features = ["native-tls", "zip"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["net", "rt", "sync", "process", "io-util", "time"] }
tokio-util = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "=0.16.0", default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Match the source-selected GTK binding; also used by the integrity regression.
glib = "=0.18.5"
futures-util = { workspace = true }
notify-rust = "=4.18.0"
zbus = "=5.19.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keepawake = "=0.6.1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "=0.55.0"

[dev-dependencies]
rcgen = "0.14.8"
rusqlite = { workspace = true }
rstorrent-remote-relay = { path = "../../../crates/rstorrent-remote-relay" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication"] }
